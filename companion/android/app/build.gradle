plugins { id 'com.android.application' }
def signingNames = ['CYT_STORE_FILE', 'CYT_STORE_PASSWORD', 'CYT_KEY_ALIAS', 'CYT_KEY_PASSWORD']
def signingValues = signingNames.collect { providers.environmentVariable(it).orNull }
def hasReleaseSigning = signingValues.every { it != null && !it.isEmpty() }
if (signingValues.any { it != null } && !hasReleaseSigning) {
    throw new GradleException('Set all four CYT signing environment variables, or leave all unset.')
}
android {
    namespace 'org.cleantv.companion'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'org.cleantv.companion'; minSdk 26; targetSdk 34; versionCode 4; versionName '0.1.3-experimental' }
    signingConfigs {
        if (hasReleaseSigning) {
            privateRelease {
                storeFile file(signingValues[0]); storePassword signingValues[1]
                keyAlias signingValues[2]; keyPassword signingValues[3]
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (hasReleaseSigning) signingConfig signingConfigs.privateRelease } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
