name: Public source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r companion/scripts/requirements.txt
      - run: python -m unittest discover -s custom-tools -p 'test_*.py' -v
      - run: python -m unittest discover -s companion/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_smarttube_patch.py
      - run: python scripts/check_public.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Launcher tests, lint, development and unsigned release builds
        run: sh launcher/gradlew -p launcher --no-daemon testReleaseUnitTest lintRelease assembleDebug assembleRelease
      - name: Companion lint and builds
        run: sh companion/android/gradlew -p companion/android --no-daemon lintRelease assembleDebug assembleRelease
      - run: python3 scripts/check_apk_size.py
      - name: Reviewable build artifacts (not an automatic release)
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-and-development-builds
          path: |
            launcher/app/build/outputs/apk/
            launcher/app/build/reports/
            companion/android/app/build/outputs/apk/
            companion/android/app/build/reports/
          retention-days: 7
